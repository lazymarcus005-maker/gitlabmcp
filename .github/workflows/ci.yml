name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm run build
      - run: npm test

  # Read-only smoke tests against the real GitLab instance; only runs when
  # credentials are configured as repository secrets/variables.
  smoke:
    runs-on: ubuntu-latest
    needs: build-test
    env:
      GITLAB_MCP_SMOKE_URL: ${{ vars.GITLAB_MCP_SMOKE_URL }}
      GITLAB_MCP_SMOKE_TOKEN: ${{ secrets.GITLAB_MCP_SMOKE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm run build
      - run: npm run smoke
