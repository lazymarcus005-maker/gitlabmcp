# GitLab MCP deployment (NFR-4): stateless, replicas >= 2, no persistence,
# no sticky sessions — any replica can serve any request.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab-mcp
  labels:
    app: gitlab-mcp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gitlab-mcp
  template:
    metadata:
      labels:
        app: gitlab-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: gitlab-mcp
          # Replace with your registry path, e.g. registry.internal/gitlab-mcp:1.0.0
          image: gitlab-mcp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: gitlab-mcp-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
